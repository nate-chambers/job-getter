[profile]
name = "Nate infrastructure/network search"
summary = "Seattle-area infrastructure, networking, systems, operations, cloud support, solutions engineering, and sales engineering roles."

[location]
target_metro_label = "Seattle area"
target_region_label = "Washington"
target_cities = [
  "seattle",
  "bellevue",
  "redmond",
  "kirkland",
  "renton",
  "bothell",
  "everett",
  "tacoma",
  "issaquah",
  "lynnwood",
  "seatac",
  "tukwila",
]
target_region_terms = [
  "wa",
  "washington",
  "washington state",
  "king county",
  "snohomish county",
  "pierce county",
]
remote_us_terms = ["remote", "united states", "usa", "us"]
non_us_remote_terms = [
  "india",
  "canada",
  "europe",
  "emea",
  "apac",
  "latam",
  "united kingdom",
  "uk",
  "germany",
  "berlin",
  "munich",
  "hamburg",
  "egypt",
  "kuwait",
  "bahrain",
  "nordics",
  "calgary",
  "toronto",
]
excluded_location_terms = [
  "washington dc",
  "district of columbia",
  "us-dc washington",
  "dc office",
]
suspicious_location_terms = [
  "international",
]

[roles]
target_buckets = [
  "Infrastructure",
  "Network",
  "Systems",
  "Operations",
  "Solutions",
  "Sales Engineer",
  "Cloud",
]

[role_terms]
infrastructure = ["infrastructure", "data center", "datacenter"]
network = ["network engineer", "network automation", "network operations", "noc"]
systems = ["systems engineer", "system engineer", "systems administrator", "sysadmin"]
operations = ["operations engineer", "technical operations", "operations technician", "support engineer"]
solutions = ["solutions engineer", "solution engineer", "customer engineer", "technical account"]
sales_engineer = ["sales engineer", "pre-sales", "presales"]
cloud = ["cloud engineer", "cloud support", "cloud systems"]
devops_sre = ["sre", "site reliability", "devops"]
swe = [
  "software engineer",
  "software developer",
  "application developer",
  "java developer",
  "frontend",
  "backend",
  "full stack",
  "systems development engineer",
]
security = ["security", "cyber"]

[filters]
senior_title_terms = ["senior", "sr.", "sr", "staff", "principal"]
customer_engineering_exception_terms = ["sales engineer", "solutions engineer", "solution engineer"]
hard_excluded_title_terms = [
  "country director",
  "director",
  "head of",
  "leader",
  "manager",
  "senior manager",
  "business analyst",
  "project manager",
  "program manager",
  "coordinator",
  "account executive",
  "hardware systems engineer",
  "power system engineer",
  "quality systems engineer",
  "systems development engineer",
]

[apply]
max_years = 3
min_resume_match = 3
min_score = 55
max_interview_difficulty = 6
require_live_verification = true

[scoring]
user_strength_terms = [
  "linux",
  "ubuntu",
