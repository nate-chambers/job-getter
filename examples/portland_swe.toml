[profile]
name = "Portland SWE and adjacent search"
summary = "Software engineering, platform, cloud, DevOps/SRE, infrastructure-adjacent, and technical support roles around Portland, Oregon."

[location]
target_metro_label = "Portland area"
target_region_label = "Oregon / SW Washington"
target_cities = [
  "portland",
  "beaverton",
  "hillsboro",
  "tigard",
  "lake oswego",
  "gresham",
  "vancouver",
]
target_region_terms = [
  "or",
  "oregon",
  "multnomah county",
  "washington county",
  "clackamas county",
  "clark county",
  "wa",
]
remote_us_terms = ["remote", "united states", "usa", "us"]
non_us_remote_terms = ["india", "canada", "europe", "emea", "apac", "latam", "united kingdom", "uk", "germany"]
excluded_location_terms = ["washington dc", "district of columbia"]

[roles]
target_buckets = ["SWE", "Cloud", "DevOps/SRE", "Infrastructure", "Systems", "Operations"]

[role_terms]
swe = [
  "software engineer",
  "software developer",
  "backend",
  "frontend",
  "full stack",
  "full-stack",
  "web developer",
  "application developer",
]
cloud = ["cloud engineer", "cloud support", "cloud systems", "platform engineer"]
devops_sre = ["sre", "site reliability", "devops", "platform engineer"]
infrastructure = ["infrastructure", "platform infrastructure"]
systems = ["systems engineer", "system engineer"]
operations = ["operations engineer", "technical support engineer"]

[filters]
senior_title_terms = ["senior", "sr.", "sr", "staff", "principal"]
hard_excluded_title_terms = [
  "director",
  "manager",
  "project manager",
  "program manager",
  "account executive",
]

[apply]
max_years = 3
min_resume_match = 3
min_score = 50
max_interview_difficulty = 8

[scoring]
